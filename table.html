<head>
    <meta charset="UTF-8">

    <!--main css files-->
    <link rel="stylesheet" href="css/master.css">
    <link rel="stylesheet" href="css/table.css">

    <link rel="stylesheet" href="css/all.min.css">
    <!--google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&display=swap" rel="stylesheet">
    <!-- Lenis Stylesheet & Script -->
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.25/dist/lenis.css">
    <script src="https://unpkg.com/lenis@1.3.25/dist/lenis.min.js"></script>
</head>
<script>
    // Enable auto-rendering smooth scroll
    const lenis = new Lenis({
        autoRaf: true,
    });
</script>

<body>
    <header>
        <div class="container">
            <div class="logo">
                <span>CHEMISTRY</span>
                <span>HUB</span>
            </div>
            <div class="menu">
                <i class="fas fa-bars"></i>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#Table">Periodic Table</a></li>
                    <li><a href="index.html#Formulas">Formulas</a></li>
                    <li><a href="index.html#Contact">Contact</a></li>
                </ul>
            </nav>
            <div class="icons">
                <i class="fa-solid fa-vial"></i>
                <i class="fa-solid fa-flask"></i>
            </div>
        </div>
    </header>
    <div class="pertable">
        <div class="container">
            <div class="main-head">
                <h2>Periodic Table</h2>
                <p>Dive into atomic numbers and electron configurations</p>
            </div>
            <div class="content"></div>
            <div class="card">
                <div class="left">

                <div class="right">
                    <h4 style="display: none;">Properties</h4>
                    <span class="name"></span>
                    <span class="number"></span>
                    <span class="type"></span>
                    <span class="row"></span>
                    <span class="column"></span>
                    <span class="formula"></span>
                </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
